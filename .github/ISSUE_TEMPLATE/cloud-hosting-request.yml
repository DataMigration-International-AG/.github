name: 🌩️ New Cloud Hosting Request
description: Request a new cloud hosting instance for a customer
title: "[Cloud Request] <Instance Name> - <Customer>"
labels: ["cloud-request", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📥 Cloud System Request Form
        Please fill in the details below to request a new cloud instance.

  - type: input
    id: username
    attributes:
      label: Username
      description: Your user login
      placeholder: "${{ github.actor }}"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      description: Role of the requester
      placeholder: "Project Manager"
    validations:
      required: true

  - type: input
    id: instance
    attributes:
      label: Instance Name
      placeholder: "R-AZ#####"
    validations:
      required: true

  - type: input
    id: customer
    attributes:
      label: Customer
      placeholder: "Customer (00000#####)"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Cloud Provider
      options:
        - "AZURE"
        - "AWS"
        - "GCP"
        - "Other"
    validations:
      required: true

  - type: input
    id: cloudtype
    attributes:
      label: Cloud Type
      placeholder: "JiVS private cloud"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "JiVS IMP 11"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Region
      placeholder: "CH"
    validations:
      required: true

  - type: input
    id: volume
    attributes:
      label: Data Volume (GB)
      placeholder: "1000"
    validations:
      required: true

  - type: input
    id: prod_date
    attributes:
      label: Desired Productive Date
      placeholder: "yyyy/mm/dd"
    validations:
      required: true

  - type: input
    id: requested_at
    attributes:
      label: Requested at
      placeholder: "yyyy/mm/dd hh:mm:ss"
    validations:
      required: true

  - type: input
    id: requested_from
    attributes:
      label: Requested from
      placeholder: "firstname.lastname"
    validations:
      required: true

  - type: textarea
    id: functional
    attributes:
      label: Functional Expansions
      placeholder: "Describe any functional customizations or expansions"
    validations:
      required: false

  - type: dropdown
    id: monitored
    attributes:
      label: Should it be monitored?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - "NEW"
        - "APPROVED"
        - "IN PROGRESS"
        - "COMPLETED"
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Additional Options or Comments
      placeholder: "Add any extra info or custom requirements"
    validations:
      required: false
